name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Descomprimir proyecto
        run: |
          set -e
          ZIP=$(ls WishlistTCG_MVP_Android*.zip | head -1)
          echo "Usando $ZIP"
          mkdir project
          unzip -q "$ZIP" -d project
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          test -f "$DIR/settings.gradle.kts"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Compilar APK de depuración
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" WishlistTCG.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WishlistTCG build ${{ github.run_number }}
          files: WishlistTCG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WishlistTCG-apk
          path: WishlistTCG.apk
